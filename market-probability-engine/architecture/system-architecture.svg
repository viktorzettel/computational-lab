<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">Market Probability Engine public research architecture</title>
<desc id="desc">Contract identity and official strike feed a price-model branch; market prices provide returns for volatility, jump and Kou estimation. Level-2 snapshots form a separate descriptive feature branch. Outcomes join only in subsequent evaluation. Private decision and execution are outside the diagram.</desc>
<defs>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#1d2938}.title{font-size:25px;font-weight:700}.sub{font-size:13px;fill:#617083}.step{font-size:13px;font-weight:700;fill:#37627b}.head{font-size:17px;font-weight:600}.note{font-size:12px;fill:#607082}.line{stroke:#7893a6;stroke-width:1.5;fill:none;marker-end:url(#arrow)}.dash{stroke-dasharray:5 5}
</style>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#7893a6"/></marker>
</defs>
<rect width="1200" height="610" fill="#f6f8f9"/>
<text class="title" x="42" y="48">From observations to evaluated probabilities</text>
<text class="sub" x="42" y="73">Public reference components · current production calibration and execution are outside scope</text>
<g fill="#fff" stroke="#cbd6dd" stroke-width="1.4">
<rect x="42" y="116" width="270" height="95" rx="5"/><rect x="345" y="116" width="270" height="95" rx="5"/><rect x="648" y="116" width="270" height="95" rx="5"/>
<rect x="345" y="267" width="270" height="95" rx="5"/><rect x="648" y="267" width="270" height="95" rx="5"/>
<rect x="42" y="415" width="270" height="95" rx="5"/><rect x="648" y="415" width="270" height="95" rx="5"/>
</g>
<text class="step" x="58" y="143">01–02 / CONTRACT</text><text class="head" x="58" y="171">Identity, strike, expiry</text><text class="note" x="58" y="192">Official fields retained separately</text>
<text class="step" x="361" y="143">03 / PRICE SERIES</text><text class="head" x="361" y="171">Fixed-grid log returns</text><text class="note" x="361" y="192">Synthetic intervals marked</text>
<text class="step" x="664" y="143">04 / ESTIMATION</text><text class="head" x="664" y="171">Volatility and jumps</text><text class="note" x="664" y="192">Past observations only</text>
<text class="step" x="361" y="294">06 / ORDER BOOK</text><text class="head" x="361" y="322">L2 feature summaries</text><text class="note" x="361" y="343">Independent descriptive branch</text>
<text class="step" x="664" y="294">05 / MODEL</text><text class="head" x="664" y="322">Kou and diffusion</text><text class="note" x="664" y="343">Terminal event probabilities</text>
<text class="step" x="58" y="442">AFTER EXPIRY</text><text class="head" x="58" y="470">Official resolution</text><text class="note" x="58" y="491">Never a forecast input</text>
<text class="step" x="664" y="442">EVALUATION</text><text class="head" x="664" y="470">Calibration and scores</text><text class="note" x="664" y="491">Compare declared baselines</text>
<path class="line" d="M312 163H344M615 163H647M783 211V266M783 362V414M312 462H647M480 211V266"/>
<path class="line dash" d="M918 315H1095V466H919"/>
<text class="note" x="940" y="294">Features may be analysed</text><text class="note" x="940" y="312">alongside probabilities;</text><text class="note" x="940" y="330">no public decision rule.</text>
<text class="sub" x="42" y="563">The historical BTC return study has a different target from officially settled prediction-market contracts.</text>
</svg>
